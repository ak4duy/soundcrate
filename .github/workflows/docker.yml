name: Publish Docker image

on:
  push:
    branches:
      - master
      - nightly
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # Use the run's start time as the build date so /about can compare
      # identical timestamps against successful published runs on either branch.
      - name: Collect build metadata
        id: build_meta
        uses: actions/github-script@v8
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });
            core.setOutput('branch', context.ref.replace(/^refs\/(heads|tags)\//, ''));
            core.setOutput('build_date', run.run_started_at);
            core.setOutput('sha', context.sha);
            core.setOutput('repository', `${context.repo.owner}/${context.repo.repo}`);

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ak4duy/soundcrate
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/nightly' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_BRANCH=${{ steps.build_meta.outputs.branch }}
            BUILD_DATE=${{ steps.build_meta.outputs.build_date }}
            BUILD_SHA=${{ steps.build_meta.outputs.sha }}
            BUILD_REPOSITORY=${{ steps.build_meta.outputs.repository }}
          cache-from: type=gha,scope=soundcrate
          cache-to: type=gha,mode=max,scope=soundcrate

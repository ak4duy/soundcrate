services:
  bot:
    # latest or nightly
    image: ghcr.io/ak4duy/soundcrate:latest
    restart: unless-stopped
    init: true
    environment:
      # Your Discord bot token
      DISCORD_TOKEN: 'REPLACE_WITH_YOUR_BOT_TOKEN'
      MUSIC_DIR: /music
      # Optional server ID for immediate command registration; empty means global.
      GUILD_ID: ''
      IDLE_TIMEOUT_SECONDS: '300'
      RUST_LOG: soundcrate=info,songbird=warn,serenity=warn
    volumes:
      - type: bind
        # Absolute path to your music folder on the host.
        source: /absolute/path/to/music
        target: /music
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

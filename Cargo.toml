[package]
name = "soundcrate"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A self-hosted Discord music bot for your local music library"

[dependencies]
anyhow = "1"
rand = "0.9.5"
serenity = { version = "0.12", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "rustls_backend", "voice"] }
songbird = { version = "0.6", features = ["builtin-queue"] }
symphonia = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true

[profile.dev]
debug = 0
